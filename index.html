<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME-BOX-NAM</title>
    <link rel="stylesheet" href="thicuoiky.css">
</head>

<body>
    <div class="div-1-control-bar">
        <div class="div-1-1-start-stop-field">
            <button class="btn-1-1-start" style="background-color: green;">
                <img class="icon-1-1-start" src="thicuoikyphoto/icons8-start-50.png" alt="Start button icon">
                <p class="p-1-1-start">START</p>
            </button>
            <button class="btn-1-1-stop" style="background-color: red;">
                <img class="icon-1-1-stop" src="thicuoikyphoto/icons8-stop-50.png" alt="Stop button icon">
                <p class="p-1-1-stop">STOP</p>
            </button>
        </div>
        <div class="div-1-2-theme-field">
            <p class="text_chien_thang" style="display:none ;margin:0px;font-weight: 800; font-size: 30px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:red;text-align: center;padding: 0px;">Chiến Thắng !!!</p>
            <button class="btn-1-2-theme">
                <img class="icon-1-2-theme" src="" alt="Theme button icon">
                <p class="p-1-2-theme"></p>
            </button>
        </div>
    </div>
    <div class="div-2-mid-webpage">
        <div class="div-2-1-playground">
            <div class="div-2-1-1-box-game">
                <div class="cell-2-1-1-box-game-x1-y1" x="1" y="1" style="background-color: #D7FCE3; color:#0CBB4B;">1
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="1" y="2" style="background-color: #FDDEDF; color: #ED3536;">2
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="1" y="3" style="background-color: #D6E7FE; color: #3481F6;">3
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="1" y="4" style="background-color: #F1E4FF; color: #7133ef;">4
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="2" y="1" style="background-color: #FEF8BC; color: #d6cf3d;">5
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="2" y="2" style="background-color: #FDE3F1; color: #ec66a0;">6
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="2" y="3" style="background-color: #D6E7FE; color: #3b80e0;">7
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="2" y="4" style="background-color: #F1F2F5; color: #76787b;">8
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="3" y="1" style="background-color: #CBF9E0; color: #379c59;">9
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="3" y="2" style="background-color: #FFF0C0; color: #b3963f;">10
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="3" y="3" style="background-color:#E9FCC4; color: #8db046;">11
                </div>
                <div class="cell-2-1-1-box-game-x1-y1" x="3" y="4" style="background-color: #000000; color: #000000;">12
                </div>

            </div>
        </div>
        <div class="div-2-1-system-view">
            <div class="div-2-1-1-time-view">
                <p style="margin:0px;font-weight: 800; font-size: 30px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:black;text-align: center;padding: 0px;"
                    ;>Đồng Hồ</p>
                <p class="timecount">00:00</p>
            </div>
            <div class="div-2-1-2-tutorial-view">
                <p style="margin:0px;font-weight:600; font-size: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:black;text-align: center;padding: 0px;">Hướng dẫn di chuyển</p>
                <img class="img-2-1-2-tutorial" src="thicuoikyphoto/wasd.png" alt="">
                <img class="img-2-1-2-tutorial" src="thicuoikyphoto/arrow.png" alt="">
            </div>
        </div>

    </div>
    <div class="div-3-history-play-board">
        <p  style="margin:15px;font-weight:1000; font-size: 25px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:black;text-align: center;padding: 0px;">Lịch sử lượt chơi</p>
        <div class="div-3-2-history-play-board-title-table">
            <p class="p-3-2-history-play-board-text">#</p>
            <p class="p-3-2-history-play-board-text">Bước đi</p>
            <p class="p-3-2-history-play-board-text">Thời gian</p>
        </div>
    </div>


    <script src="thicuoiky.js"></script>
</body>

</html>
